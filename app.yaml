command:
  - "uvicorn"
  - "app.main:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"
env:
  - name: GROQ_API_KEY
    valueFrom: groq-api-key
  - name: GROQ_MODEL
    value: "openai/gpt-oss-120b"
  - name: AI_EXPLANATIONS_ENABLED
    value: "true"
  - name: DATABASE_URL
    valueFrom: database-url
  - name: STATIC_DIR
    value: "static"
  - name: CORS_ORIGINS
    value: "*"
