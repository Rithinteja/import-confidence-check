services:
  - type: web
    name: import-confidence-check
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: AI_EXPLANATIONS_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
